name: Build APK (Cloud)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Print env
        run: |
          java -version
          echo "Gradle version: $(gradle --version 2>/dev/null | grep Gradle || echo n/a)"

      - name: Build Debug APK (unsigned)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Show artifacts
        run: find app/build/outputs -name '*.apk' -exec ls -la {} \;

      - name: Upload APK artifact (unsigned debug)
        uses: actions/upload-artifact@v4
        with:
          name: uu-transparent-proxy-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
